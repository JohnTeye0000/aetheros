[package]
name = "aetheros_kernel"
version = "0.1.0"
edition = "2021"
description = "AetherOS — a small x86-64 kernel written from scratch in Rust"

[dependencies]
# `map_physical_memory` makes the bootloader map all of RAM at a known virtual
# offset and pass us the memory map — both needed to walk the page tables.
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }
volatile = "0.2.6"
spin = "0.5.2"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
uart_16550 = "0.2.0"
x86_64 = "0.14.7"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"

# Abort on panic — we have no unwinding runtime in a bare-metal kernel.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
# Run the kernel in QEMU. -serial stdio mirrors kernel serial output to our
# terminal so the build can be verified headlessly (no GUI needed).
run-args = ["-serial", "stdio"]
